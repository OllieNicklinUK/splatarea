<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newton Demo — Particles + Crowd</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; }
    canvas { display: block; }

    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #fff;
      font-size: 12px;
      opacity: 0.7;
      pointer-events: none;
    }

    #status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      margin-right: 6px;
      vertical-align: middle;
    }
    #status .dot.connected { background: #4caf50; }
    #status .dot.mock { background: #ff9800; }

    #hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 11px;
      opacity: 0.4;
      pointer-events: none;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Connecting...</span>
  </div>
  <div id="hint">CLICK TO SMASH &nbsp;·&nbsp; DRAG TO ORBIT &nbsp;·&nbsp; SCROLL TO ZOOM</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
