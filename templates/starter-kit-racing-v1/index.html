<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Racing</title>
	<style>
		:root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
		body { margin: 0; overflow: hidden; background: #000; }
		canvas { display: block; touch-action: none; }
		button { font: inherit; }
		#hud-root {
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: 20;
		}
		#auth-root, #race-root, #leaderboard-root, #result-root { pointer-events: auto; }
		.auth-card, .race-card, .result-card, .leaderboard-panel, .leaderboard-toggle {
			background: rgba(8,10,16,0.72);
			backdrop-filter: blur(16px);
			border: 1px solid rgba(255,255,255,0.12);
			box-shadow: 0 18px 60px rgba(0,0,0,0.38);
		}
		#auth-root {
			position: absolute;
			top: 12px;
			left: 12px;
			width: min(320px, calc(100vw - 24px));
		}
		.auth-card {
			padding: 14px 16px;
			border-radius: 18px;
		}
		.auth-kicker, .race-kicker, .leaderboard-kicker {
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 0.22em;
			color: rgba(255,255,255,0.55);
		}
		.auth-title, .race-title, .leaderboard-title {
			font-size: 18px;
			font-weight: 700;
			margin-top: 6px;
			color: #fff;
		}
		.auth-meta, .auth-error, .race-meta, .leaderboard-meta, .leaderboard-status {
			font-size: 12px;
			line-height: 1.45;
			margin-top: 8px;
			color: rgba(255,255,255,0.72);
		}
		.auth-error { color: #ffb2b2; }
		.auth-actions, .leaderboard-actions {
			display: flex;
			gap: 8px;
			margin-top: 12px;
		}
		.auth-button, .leaderboard-actions button, .result-button {
			border: 0;
			border-radius: 999px;
			padding: 10px 14px;
			background: #f6f6f6;
			color: #111;
			cursor: pointer;
			font-weight: 700;
		}
		.auth-button:disabled, .leaderboard-actions button:disabled { opacity: 0.5; cursor: default; }
		.race-actions {
			display: flex;
			justify-content: flex-end;
			gap: 8px;
			margin-top: 12px;
		}
		.race-button {
			border: 0;
			border-radius: 999px;
			padding: 9px 12px;
			background: rgba(255,255,255,0.92);
			color: #111;
			cursor: pointer;
			font-size: 12px;
			font-weight: 700;
		}
		.race-button:disabled {
			opacity: 0.45;
			cursor: default;
		}
		#race-root {
			position: absolute;
			top: 12px;
			right: 12px;
		}
		.race-card {
			padding: 14px 16px;
			border-radius: 18px;
			min-width: 190px;
			text-align: right;
		}
		.race-title {
			font-size: 28px;
			font-variant-numeric: tabular-nums;
		}
		.race-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
			margin-top: 12px;
		}
		.race-pill {
			background: rgba(255,255,255,0.06);
			border-radius: 12px;
			padding: 8px 10px;
			text-align: left;
		}
		.race-label {
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 0.18em;
			color: rgba(255,255,255,0.45);
		}
		.race-value {
			margin-top: 4px;
			font-size: 16px;
			font-weight: 700;
			color: #fff;
			font-variant-numeric: tabular-nums;
		}
		#leaderboard-root {
			position: absolute;
			left: 12px;
			bottom: 12px;
		}
		.leaderboard-toggle {
			width: 56px;
			height: 56px;
			border-radius: 18px;
			border: 0;
			color: #fff;
			cursor: pointer;
			font-size: 24px;
		}
		.leaderboard-panel {
			width: min(320px, calc(100vw - 24px));
			border-radius: 22px;
			padding: 16px;
		}
		.leaderboard-shell.is-collapsed .leaderboard-panel { display: none; }
		.leaderboard-shell:not(.is-collapsed) .leaderboard-toggle { display: none; }
		.leaderboard-header {
			display: flex;
			align-items: start;
			justify-content: space-between;
			gap: 12px;
		}
		.leaderboard-close {
			border: 0;
			border-radius: 12px;
			width: 36px;
			height: 36px;
			background: rgba(255,255,255,0.08);
			color: #fff;
			cursor: pointer;
			font-size: 18px;
		}
		.leaderboard-list {
			margin-top: 12px;
			display: grid;
			gap: 8px;
			max-height: 240px;
			overflow-y: auto;
		}
		.leaderboard-row, .leaderboard-empty {
			display: grid;
			grid-template-columns: auto 1fr auto;
			gap: 10px;
			align-items: center;
			padding: 10px 12px;
			border-radius: 14px;
			background: rgba(255,255,255,0.06);
			font-size: 13px;
			color: #fff;
		}
		.leaderboard-empty {
			grid-template-columns: 1fr;
			color: rgba(255,255,255,0.6);
		}
		.leaderboard-player {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.leaderboard-score {
			font-variant-numeric: tabular-nums;
			font-weight: 700;
		}
		#result-root {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: rgba(0,0,0,0.38);
		}
		#result-root[hidden] { display: none; }
		.result-card {
			width: min(360px, 100%);
			padding: 22px;
			border-radius: 24px;
			text-align: center;
		}
		.result-value {
			font-size: 34px;
			font-weight: 800;
			color: #fff;
			font-variant-numeric: tabular-nums;
			margin-top: 8px;
		}
		.result-meta {
			margin-top: 12px;
			font-size: 13px;
			color: rgba(255,255,255,0.72);
		}
		.result-button { margin-top: 18px; }
		.result-help {
			margin-top: 8px;
			font-size: 12px;
			color: rgba(255,255,255,0.52);
		}
	</style>
	<script src="https://www.viverse.com/static-assets/viverse-sdk/index.umd.cjs"></script>
	<script>
		window.__STARTER_KIT_RACING_CONFIG__ = {
			clientId: '',
			leaderboardName: 'starter-kit-racing-time',
			lapsToFinish: 3
		};
	</script>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.2"
		}
	}
	</script>
</head>
<body>
	<div id="hud-root">
		<div id="auth-root"></div>
		<div id="race-root">
			<div class="race-card">
				<div class="race-kicker">Starter Kit Racing</div>
				<div id="race-time" class="race-title">00:00.00</div>
				<div class="race-grid">
					<div class="race-pill">
						<div class="race-label">Laps</div>
						<div id="race-lap" class="race-value">0 / 3</div>
					</div>
					<div class="race-pill">
						<div class="race-label">Status</div>
						<div id="race-status" class="race-value">Ready</div>
					</div>
				</div>
				<div class="race-meta">App ID: <span id="viverse-appid">missing</span></div>
				<div class="race-meta">Map: <span id="map-mode">Default Loop</span></div>
				<div class="race-meta">Leaderboard: <span id="leaderboard-name">starter-kit-racing-time</span></div>
				<div class="race-actions">
					<button id="random-map-button" class="race-button" type="button">Random Loop</button>
				</div>
			</div>
		</div>
		<div id="leaderboard-root"></div>
		<div id="result-root" hidden>
			<div class="result-card">
				<div class="race-kicker">Race Complete</div>
				<div id="result-time" class="result-value">00:00.00</div>
				<div class="result-meta">Leaderboard score: <span id="result-score">0</span></div>
				<button id="result-action" class="result-button" type="button">Race Again</button>
				<div class="result-help">Press <strong>R</strong> to restart at any time.</div>
			</div>
		</div>
	</div>
	<script type="module" src="js/main.js"></script>
</body>
</html>
