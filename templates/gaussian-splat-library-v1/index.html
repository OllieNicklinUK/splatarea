<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prop Library & Meshy AI Generation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; overflow: hidden;
      background-color: #1a1a24; color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; height: 100vh;
    }

    /* ─── TOP SETTINGS BAR ─── */
    #settings-bar {
      display: flex; align-items: center; gap: 8px;
      background: #0d1117; border-bottom: 1px solid #333;
      padding: 8px 16px; flex-shrink: 0; flex-wrap: wrap;
      z-index: 20;
    }
    #settings-bar label {
      font-size: 10px; color: #88c0d0; text-transform: uppercase;
      letter-spacing: 1px; white-space: nowrap;
    }
    #settings-bar input, #settings-bar select {
      background: #1a1f2e; border: 1px solid #444; color: #fff;
      padding: 4px 6px; border-radius: 3px; font-family: inherit; font-size: 11px;
    }
    #settings-bar input[type="text"] { width: 280px; }
    #settings-bar input[type="number"] { width: 70px; }
    #settings-bar select { width: 110px; }
    #settings-bar textarea { 
      background: #1a1f2e; border: 1px solid #444; color: #fff;
      padding: 4px 6px; border-radius: 3px; font-family: inherit; font-size: 11px;
      resize: none; height: 24px; width: 220px;
    }
    .settings-group {
      display: flex; align-items: center; gap: 4px;
      border-right: 1px solid #333; padding-right: 8px;
    }
    .settings-group:last-child { border-right: none; }
    #meshy-btn {
      background: #22d3ee; color: #000; border: none;
      padding: 6px 20px; border-radius: 4px; font-weight: bold;
      cursor: pointer; font-family: inherit; font-size: 12px;
      text-transform: uppercase; letter-spacing: 2px;
      transition: background 0.2s;
    }
    #meshy-btn:hover { background: #67e8f9; }
    #meshy-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    /* ─── MAIN LAYOUT ─── */
    #main-layout { display: flex; flex: 1; overflow: hidden; }
    
    #sidebar {
      width: 280px; background: rgba(0, 0, 0, 0.8);
      border-right: 1px solid #444; display: flex; flex-direction: column;
      z-index: 10; overflow-y: auto; flex-shrink: 0;
    }
    .panel { padding: 12px; border-bottom: 1px solid #333; }
    h2 { margin: 0 0 8px 0; font-size: 14px; color: #22d3ee; }
    .prop-btn {
      width: 100%; text-align: left; background: #111; margin-bottom: 3px;
      font-size: 11px; padding: 5px 8px; border: 1px solid #333;
      color: #ccc; border-radius: 3px; cursor: pointer; font-family: inherit;
    }
    .prop-btn:hover { background: #222; border-color: #22d3ee; color: #22d3ee; }
    .prop-btn.active { background: #22d3ee; color: #000; border-color: #fff; }
    #meshy-log {
      font-size: 10px; color: #aaa; margin-top: 8px;
      min-height: 30px; max-height: 120px; overflow-y: auto;
      line-height: 1.4;
    }

    /* ─── VIEWPORT ─── */
    #viewport { flex: 1; position: relative; }
    #status-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.88);
      color: #22d3ee; font-size: 28px; font-weight: bold;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-transform: uppercase; letter-spacing: 4px; z-index: 50;
      text-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
      gap: 12px;
    }
    #status-overlay .sub { font-size: 12px; color: #aaa; letter-spacing: 2px; }

    /* ─── GENERATED MODELS LIST ─── */
    .gen-model-btn {
      width: 100%; text-align: left; background: #0a1a0a; margin-bottom: 3px;
      font-size: 11px; padding: 5px 8px; border: 1px solid #2a5a2a;
      color: #6aff6a; border-radius: 3px; cursor: pointer; font-family: inherit;
    }
    .gen-model-btn:hover { background: #1a2a1a; border-color: #6aff6a; }

    /* ─── UTILITY ─── */
    .restart-btn {
      background: #aa3333; color: white; border: none; padding: 6px 12px;
      border-radius: 3px; font-weight: bold; cursor: pointer;
      font-family: monospace; margin-top: 10px; width: 100%; font-size: 11px;
    }
    .restart-btn:hover { background: #cc4444; }
    .chk-row { display: flex; align-items: center; gap: 4px; }
    .chk-row input[type="checkbox"] { width: auto; margin: 0; }
    .chk-row label { font-size: 10px; color: #aaa; }
    .upload-file-label {
      display: block; background: #0d1a2a; border: 1px dashed #335; color: #88c0d0;
      padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 11px;
      text-align: center; transition: border-color 0.2s, color 0.2s; margin-top: 4px;
    }
    .upload-file-label:hover { border-color: #22d3ee; color: #22d3ee; }
  </style>
</head>
<body>
  <!-- ─── TOP SETTINGS BAR ─── -->
  <div id="settings-bar">
    <div class="settings-group">
      <label>Prompt</label>
      <input type="text" id="meshy-prompt" placeholder="a wooden crate with metal bands" />
    </div>
    <div class="settings-group">
      <label>Neg Prompt</label>
      <textarea id="meshy-neg-prompt">low quality, low resolution, low poly, ugly</textarea>
    </div>
    <div class="settings-group">
      <label>Art Style</label>
      <select id="meshy-style">
        <option value="realistic">Realistic</option>
        <option value="sculpture">Sculpture</option>
        <option value="pbr">PBR</option>
        <option value="cartoon">Cartoon</option>
        <option value="low-poly">Low Poly</option>
        <option value="voxel">Voxel</option>
      </select>
    </div>
    <div class="settings-group">
      <label>Topology</label>
      <select id="meshy-topology">
        <option value="triangle">Triangle</option>
        <option value="quad" selected>Quad</option>
      </select>
    </div>
    <div class="settings-group">
      <label>Polycount</label>
      <input type="number" id="meshy-polycount" value="30000" min="1000" max="200000" step="1000" />
    </div>
    <div class="settings-group">
      <label>Seed</label>
      <input type="number" id="meshy-seed" value="" placeholder="random" style="width: 60px;" />
    </div>
    <div class="settings-group">
      <div class="chk-row">
        <input type="checkbox" id="meshy-remesh" />
        <label for="meshy-remesh">Remesh</label>
      </div>
    </div>
    <div class="settings-group">
      <label>Mode</label>
      <select id="meshy-mode" style="width: 90px;">
        <option value="preview">Preview</option>
        <option value="refine">Refine</option>
      </select>
    </div>
    <div class="settings-group">
      <label>AI Model</label>
      <select id="meshy-ai-model" style="width: 100px;">
        <option value="meshy-6">Meshy-6</option>
        <option value="meshy-4">Meshy-4</option>
      </select>
    </div>
    <button id="meshy-btn">⚡ GENERATE</button>
  </div>

  <!-- ─── MAIN LAYOUT ─── -->
  <div id="main-layout">
    <div id="sidebar">
      <div class="panel">
        <h2>🌍 Import World</h2>
        <div style="font-size:10px;color:#556;margin-bottom:8px;">Upload .glb or .ply. PLY splats auto-generate a voxel collision mesh via <code style="color:#88c0d0">splat-transform</code>. Press <b style="color:#22d3ee">1</b> → FPS, <b style="color:#eab308">F</b> → walk.</div>
        <div>
          <label class="upload-file-label" for="world-upload-input">📂 World (.glb / .ply)</label>
          <input type="file" id="world-upload-input" accept=".glb,.gltf,.ply" style="display:none">
        </div>
        <div id="collider-row" style="display:none; margin-top:4px;">
          <label class="upload-file-label" for="collider-upload-input">📂 Collider GLB (optional)</label>
          <input type="file" id="collider-upload-input" accept=".glb,.gltf" style="display:none">
        </div>
        <div class="chk-row" style="margin-top:6px;">
          <input type="checkbox" id="flip-y-upload" checked>
          <label for="flip-y-upload">Flip Y (Polycam/most exporters)</label>
        </div>
        <div style="margin-top:8px;border-top:1px solid #222;padding-top:8px;">
          <div style="font-size:10px;color:#88c0d0;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;">splat-transform params</div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div class="chk-row" style="gap:6px;">
              <label style="font-size:10px;color:#556;width:80px;flex-shrink:0;">Seed pos</label>
              <input id="seed-pos-input" type="text" value="auto" placeholder="auto or x,y,z"
                style="background:#0d1117;border:1px solid #333;color:#aaa;padding:2px 5px;border-radius:2px;font-family:monospace;font-size:10px;flex:1;min-width:0;">
            </div>
            <div class="chk-row" style="gap:6px;">
              <label style="font-size:10px;color:#556;width:80px;flex-shrink:0;">Voxel res</label>
              <input id="voxel-params-input" type="text" value="0.1,0.15" placeholder="floor,wall"
                style="background:#0d1117;border:1px solid #333;color:#aaa;padding:2px 5px;border-radius:2px;font-family:monospace;font-size:10px;flex:1;min-width:0;">
            </div>
            <div class="chk-row" style="gap:6px;">
              <label style="font-size:10px;color:#556;width:80px;flex-shrink:0;">Carve</label>
              <input id="voxel-carve-input" type="text" value="1.6,0.5" placeholder="height,radius"
                style="background:#0d1117;border:1px solid #333;color:#aaa;padding:2px 5px;border-radius:2px;font-family:monospace;font-size:10px;flex:1;min-width:0;">
            </div>
            <div class="chk-row" style="gap:6px;">
              <label style="font-size:10px;color:#556;width:80px;flex-shrink:0;">Opacity min</label>
              <input id="opacity-threshold-input" type="text" value="0.2" placeholder="0–1 sigmoid"
                style="background:#0d1117;border:1px solid #333;color:#aaa;padding:2px 5px;border-radius:2px;font-family:monospace;font-size:10px;flex:1;min-width:0;">
            </div>
          </div>
        </div>
        <div id="upload-status" style="font-size:10px;color:#88c0d0;margin-top:6px;min-height:16px;line-height:1.5;word-break:break-word;"></div>
      </div>

      <div class="panel">
        <h2>🧱 Collider</h2>
        <div id="collider-state" style="font-size:10px;color:#88c0d0;min-height:14px;margin-bottom:8px;line-height:1.5;">No collider loaded</div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <button class="restart-btn" id="btn-toggle-collision"
            style="background:#0d1a2a;color:#22d3ee;border:1px solid #224;">
            🔍 Show Collision &nbsp;<span style="color:#335;font-size:9px;">[ P ]</span>
          </button>
          <button class="restart-btn" id="btn-regen-collision"
            style="background:#0d1a0d;color:#6aff6a;border:1px solid #242;">
            ↺ Regenerate Collider
          </button>
          <button class="restart-btn" id="btn-delete-collision"
            style="background:#1a0d0d;color:#ef4444;border:1px solid #422;">
            🗑 Delete Collider
          </button>
        </div>
      </div>

      <div class="panel">
        <h2>📦 Generated Models</h2>
        <div id="generated-models-list">
          <p style="font-size: 10px; color: #555;">No models generated yet</p>
        </div>
      </div>

      <div class="panel">
        <h2>📁 File Models</h2>
        <div id="file-models-list"></div>
      </div>
      
      <div class="panel">
        <h2>🏗️ Local Procedural Props</h2>
        <div id="local-props-list"></div>
      </div>

      <div class="panel">
        <button class="restart-btn" id="btn-restart-server">↻ Restart Vite Server</button>
      </div>
    </div>
    
    <div id="viewport">
      <div id="status-overlay">
        <span id="status-text">Loading...</span>
        <span class="sub" id="status-sub"></span>
      </div>
    </div>
  </div>
  
  <!-- ─── Tank Game HUD (hidden until a splat loads) ─── -->
  <div id="tank-hud" style="
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 8000;
    flex-direction: column; align-items: stretch; pointer-events: none;
    font-family: 'Courier New', Courier, monospace;
  ">
    <!-- HP bars -->
    <div style="display:flex; gap:8px; padding:8px 16px; background:rgba(0,0,0,0.6); align-items:center;">
      <!-- P1 -->
      <span style="font-size:10px;color:#38bdf8;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;">YOU</span>
      <div style="flex:1;height:10px;background:#1a2a3a;border-radius:2px;overflow:hidden;">
        <div id="tank-p1-hp" style="width:100%;height:100%;background:#38bdf8;transition:width 0.2s;border-radius:2px;"></div>
      </div>
      <div id="tank-timer" style="font-size:13px;color:#e2e8f0;min-width:36px;text-align:center;font-weight:bold;">75s</div>
      <div style="flex:1;height:10px;background:#2a1a1a;border-radius:2px;overflow:hidden;">
        <div id="tank-p2-hp" style="width:100%;height:100%;background:#fb7185;transition:width 0.2s;border-radius:2px;"></div>
      </div>
      <span style="font-size:10px;color:#fb7185;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;">BOT</span>
      <button id="tank-restart-btn" style="
        pointer-events:auto; margin-left:12px;
        background:#22d3ee; color:#000; border:none; border-radius:3px;
        font-family:inherit; font-size:10px; font-weight:bold;
        text-transform:uppercase; letter-spacing:1px; padding:4px 12px; cursor:pointer;
      ">Restart</button>
    </div>
    <!-- Status line -->
    <div style="background:rgba(0,0,0,0.45); padding:4px 16px;">
      <span id="tank-status" style="font-size:10px;color:#94a3b8;letter-spacing:1px;"></span>
    </div>
  </div>

  <script type="module" src="/src/library.js"></script>
</body>
</html>
