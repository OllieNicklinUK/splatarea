<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TankArena 3D Prototype</title>
    <script src="https://www.viverse.com/static-assets/viverse-sdk/index.umd.cjs"></script>
    <script src="https://www.viverse.com/static-assets/play-sdk/1.0.1/play-sdk.umd.js"></script>
    <script>
      window.__TANKARENA_CONFIG__ = {
        clientId: "YOUR_APP_ID",
        leaderboardName: "tankarena-wins",
        versionName: "0.2.0-auth-leaderboard"
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0d1117;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(44, 69, 122, 0.55), transparent 42%),
          linear-gradient(180deg, #131a26 0%, #090b10 100%);
      }

      body {
        color: #eff4ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
  </html>
